<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leticinha App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#ff69b4"/>
  <script src="script.js" defer></script> 
</head>
<body>
  <div class="app">
    
    <header>
      <div class="header-left">
        <h1>💖 Leticinha & Davi 💖</h1>
        <p class="subtitle">Cuidado, rotina e amor</p>
      </div>
      <div class="header-right">
        <div class="photo-container">
          <img src="header_foto.jpg1.jpeg" alt="Foto do Casal" id="top-photo" /> 
        </div>
      </div>
    </header>

    <main>

      <section class="card water-card">
        <h2>💧 Hidratação</h2>
        <div id="water-display">
            <p class="water-placeholder">Beba seu primeiro copo! (0/8)</p>
        </div>
        <button id="add-water-btn" class="add-button">+ 1 Copo</button>
      </section>
      
      <section class="card mood-card">
        <h2>✨ Meu Sentimento</h2>
        <div id="mood-emojis">
            <p class="mood-placeholder">Como você se sente hoje?</p>
        </div>
      </section>
      
      <section id="goals-app" class="card goals-card">
        <h2>📝 Minhas Metas e Tarefas</h2>
        
        <ul id="goals-list">
          </ul>
        
        <div class="add-goal">
          <input type="text" id="new-goal" placeholder="Nova meta de cuidado...">
          <button id="add-goal-btn">Adicionar</button> 
        </div>
      </section>

      <section class="card message-card">
        <h2>💌 Mensagem do Davi</h2>
        <p id="motivate">...</p>
        <button id="next-msg">Próxima mensagem surpresa!</button>
      </section>
      
    </main>

    <footer>
      <p>Feito com ❤️ por Davi — um empurrãozinho para ela florescer.</p>
    </footer>

  </div> 
</body>
</html>
